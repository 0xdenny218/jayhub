# Preserve the original volumes when upgrading with a pre-rename deploy.env.
name: ${COMPOSE_PROJECT_NAME:-plushub4deliver}

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["--log-dir", "/data/logs"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      TZ: Asia/Shanghai
      SQL_DSN: "postgresql://plushub:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/plushub"
      REDIS_CONN_STRING: "redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0"
      SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET}"
      CRYPTO_SECRET: "${CRYPTO_SECRET:?set CRYPTO_SECRET}"
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_TRUSTED_URL: "${SITE_ORIGIN:?set SITE_ORIGIN to the public HTTPS origin}"
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      CHANNEL_MANAGEMENT_ENABLED: "${CHANNEL_MANAGEMENT_ENABLED:-false}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/status"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: plushub
      POSTGRES_USER: plushub
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "plushub", "-d", "plushub"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD:?set REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --raw ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  app_data:
  pg_data:
  redis_data:
